[package]
name = "ai-papers3"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "ai-papers3"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = "0.52"
esp-idf-hal = { version = "0.46.2" , features = [] }
embedded-sdmmc = "0.9.0"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

[build-dependencies]
embuild = "0.33"
