[package]
name = "ai-papers3"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "ai-papers3"
harness = false

[[bin]]
name = "ai-papers3-sim"
path = "src/bin/ai-papers3-sim.rs"
required-features = ["simulator"]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []
experimental = ["esp-idf-svc/experimental"]
embedded-graphics-simulator = ["dep:embedded-graphics-simulator"]
simulator = ["embedded-graphics-simulator"]

[dependencies]
log = "0.4"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.18"
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
embedded-graphics = "0.8.2"
taffy = { version = "0.5", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
embedded-graphics-simulator = { version = "0.8.0", optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-hal = "0.45"
esp-idf-svc = { version = "0.50", features = ["std", "experimental"] }
esp-idf-sys = { version = "0.36", features = ["binstart"] }
embedded-sdmmc = "0.9.0"
heapless = "0.8.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]

